name: Selenium CI

on:
  push:
    branches:
      - ci/selenium-github-actions
  pull_request:

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: medicare_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify MySQL
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SHOW DATABASES;"

      - name: Import database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot medicare_db < SpringMediCareWeb/medicare_db_ci.sql

      - name: Verify database tables
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot -D medicare_db -e "SHOW TABLES;"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build backend
        working-directory: SpringMediCareWeb/SpringMediCareApp
        run: mvn clean package -DskipTests

      - name: Setup Tomcat
        run: |
          wget https://archive.apache.org/dist/tomcat/tomcat-10/v10.1.34/bin/apache-tomcat-10.1.34.tar.gz
          tar -xzf apache-tomcat-10.1.34.tar.gz
          mv apache-tomcat-10.1.34 tomcat

      - name: Deploy backend to Tomcat
        run: |
          cp SpringMediCareWeb/SpringMediCareApp/target/SpringMediCareApp-1.0-SNAPSHOT.war tomcat/webapps/SpringMediCareApp.war
          chmod +x tomcat/bin/*.sh
          tomcat/bin/startup.sh

      - name: Verify backend
        run: |
          sleep 15
          curl -I http://localhost:8080/SpringMediCareApp/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: SpringMediCareWeb/medicareweb
        run: npm ci

      - name: Start frontend
        working-directory: SpringMediCareWeb/medicareweb
        run: |
          CI=false nohup npm start > frontend.log 2>&1 &

      - name: Verify frontend
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Waiting for frontend..."
            sleep 5
          done

          echo "Frontend failed to start"
          cat SpringMediCareWeb/medicareweb/frontend.log
          exit 1
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Selenium dependencies
        working-directory: Selenium_WebDriver
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify environment
        working-directory: Selenium_WebDriver
        run: |
          python --version
          pip --version
          pytest --version




      