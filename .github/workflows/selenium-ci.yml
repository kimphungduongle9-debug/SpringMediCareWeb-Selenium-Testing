name: Selenium CI

on:
  push:
    branches:
      - ci/selenium-github-actions
  pull_request:

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: medicare_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify MySQL
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SHOW DATABASES;"

      - name: Import database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot medicare_db < SpringMediCareWeb/medicare_db_ci.sql

      - name: Verify database tables
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot -D medicare_db -e "SHOW TABLES;"
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Selenium dependencies
        working-directory: Selenium_WebDriver
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify environment
        working-directory: Selenium_WebDriver
        run: |
          python --version
          pip --version
          pytest --version




      